# Loki: God of Stories Hyprland Window Management
# Multiversal Timeline strands & Asgardian Gold active borders

general {
    col.active_border = rgba(10b981ee) rgba(eab308ee) 45deg
    col.inactive_border = rgba(0d1712aa)
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

decoration {
    rounding = 8
    active_opacity = 0.98
    inactive_opacity = 0.92
    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(030604cc)
    }
}
