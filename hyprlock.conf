# Loki: God of Stories Hyprlock Configuration

background {
    monitor =
    path = ~/.config/omarchy/themes/god-of-stories/backgrounds/loki_god_of_stories.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(10b981ee)
    inner_color = rgba(6, 11, 8, 0.9)
    font_color = rgb(236, 253, 245)
    fade_on_empty = false
    placeholder_text = <span foreground="##4d6b57">I know what kind of god I need to be...</span>
    hide_input = false
    check_color = rgb(52, 211, 153)
    fail_color = rgb(244, 63, 94)
    fail_text = <i>Timeline collapsing ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(236, 253, 245)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgb(167, 191, 174)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 160
    halign = center
    valign = center
}
